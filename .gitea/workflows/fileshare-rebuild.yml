name: fileshare - rebuild on change & base image update
# Run title in the Actions list: scheduled/manual runs would otherwise show
# whatever commit is latest on main. Empty (push) = Gitea's default subject.
run-name: ${{ github.event_name == 'schedule' && 'Scheduled check' || github.event_name == 'workflow_dispatch' && 'Manual run' || '' }}

# Flavor 2 (the source lives in this repo, fileshare/ is a standalone Rust
# project) plus the base-digest check: push rebuilds on source changes, the
# daily schedule only when the rust:alpine build image is re-published (the
# final stage is scratch; base-digest.sh then tracks the build stage, whose
# toolchain + musl end up in the static binary).
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      # Only what goes into the image -- not the README, .env.sample or the
      # digest file (CI's own bump commit would trigger a second rebuild).
      - fileshare/src/**
      - fileshare/Cargo.toml
      - fileshare/Cargo.lock
      - fileshare/Dockerfile
      - fileshare/.dockerignore
      - fileshare/.trivyignore
      - .gitea/workflows/fileshare-rebuild.yml

env:
  REGISTRY: git.linux-ng.de
  IMAGE: git.linux-ng.de/marcel/fileshare
  # Digest of the Dockerfile's base image (rust:alpine build stage; the final
  # stage is scratch) the last build used.
  BASE_DIGEST_FILE: fileshare/.fileshare-base-digest

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The image version is the crate version: bump `version` in
      # fileshare/Cargo.toml for a release; a rebuild re-publishes the same
      # version tag (plus a dated rollback tag).
      - name: Determine version
        id: check
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' fileshare/Cargo.toml | tail -1)
          if [ -z "$VERSION" ]; then
            echo "::error::no version in fileshare/Cargo.toml" >&2
            exit 1
          fi
          echo "version: $VERSION"
          echo "tag=$(printf '%s' "$VERSION" | tr '+' '-')" >> "$GITHUB_OUTPUT"

      - name: Check base image digest
        id: base
        run: |
          set -euo pipefail
          DIGEST=$(bash .gitea/scripts/base-digest.sh fileshare/Dockerfile)
          CURRENT=$(cat "$BASE_DIGEST_FILE" 2>/dev/null || echo none)
          echo "base image: current=$CURRENT latest=$DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          if [ "$DIGEST" != "$CURRENT" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image
        if: github.event_name != 'schedule' || steps.base.outputs.changed == 'true'
        run: |
          docker build --pull \
            -t "$IMAGE:${{ steps.check.outputs.tag }}" \
            -t "$IMAGE:latest" \
            fileshare

      # Startup banner (image name + version, figlet style) as a thin layer
      # on top of the built image, same tags -- see .gitea/scripts/add-banner.sh.
      # The image is FROM scratch (no shell): its Dockerfile sets
      # LABEL de.linux-ng.image-banner=builtin, so the script only adds the
      # banner text and the binary prints it on start.
      - name: Add startup banner
        if: github.event_name != 'schedule' || steps.base.outputs.changed == 'true'
        run: |
          bash .gitea/scripts/add-banner.sh \
            "$IMAGE:${{ steps.check.outputs.tag }}" \
            "$IMAGE:latest"

      # Fail the publish on a fixable CRITICAL/HIGH. The binary is built with
      # cargo-auditable, so Trivy sees the Rust crates; accepted findings go
      # into fileshare/.trivyignore (with a reason).
      - name: Security scan (Trivy)
        if: github.event_name != 'schedule' || steps.base.outputs.changed == 'true'
        run: |
          set -euo pipefail
          ARGS=()
          if [ -f fileshare/.trivyignore ]; then
            ARGS+=(--ignorefile fileshare/.trivyignore)
          fi
          bash .gitea/scripts/trivy-scan.sh "$IMAGE:latest" "${ARGS[@]}"

      - name: Push image
        if: github.event_name != 'schedule' || steps.base.outputs.changed == 'true'
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          printf '%s' "$REGISTRY_PASSWORD" | docker login "$REGISTRY" \
            -u "$REGISTRY_USER" --password-stdin
          docker push "$IMAGE:${{ steps.check.outputs.tag }}"
          # Dated tag next to the moving version tag: a rebuild (push, base
          # update) re-publishes the same version tag, this keeps the
          # previous build pullable for a rollback.
          DATED="$IMAGE:${{ steps.check.outputs.tag }}-$(date -u +%Y%m%d)"
          docker tag "$IMAGE:${{ steps.check.outputs.tag }}" "$DATED"
          docker push "$DATED"
          docker push "$IMAGE:latest"

      - name: Record base image digest
        if: github.event_name != 'schedule' || steps.base.outputs.changed == 'true'
        run: |
          echo "${{ steps.base.outputs.digest }}" > "$BASE_DIGEST_FILE"
          git config user.email "gitea-actions@linux-ng.de"
          git config user.name "gitea-actions"
          git add "$BASE_DIGEST_FILE"
          # A push-triggered rebuild on an unchanged base writes identical
          # content -- only commit/push when the digest actually moved.
          if git diff --cached --quiet; then
            echo "no digest change to record"
            exit 0
          fi
          git commit -m "fileshare: rebuild on updated base image ${{ steps.base.outputs.digest }}"
          # Other workflows in this repo can push their own version-bump
          # commits around the same time -- retry with rebase on a
          # non-fast-forward push instead of failing outright.
          for attempt in 1 2 3 4 5; do
            if git push; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "::error::failed to push after $attempt attempts" >&2
              exit 1
            fi
            sleep $((RANDOM % 5 + 1))
            git fetch origin main
            git rebase origin/main
          done
